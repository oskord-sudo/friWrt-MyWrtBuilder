name: Generate friWrt Firmware

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Select device target:"
        required: true
        default: "x86-64"
        type: choice
        options:
          - x86-64
          - Raspberry Pi 4B
          - Raspberry Pi 3B
      release_branch:
        description: "Select the release branch:"
        required: true
        default: "openwrt:25.12.5"
        type: choice
        options:
          - openwrt:25.12.5
          - openwrt:25.12.4
          - openwrt:25.12.3
          - openwrt:24.10.8
      clean:
        description: "Do 'make clean' for each run"
        required: false
        default: "true"
        type: boolean
      upload-artifacts:
        description: "Upload compiled image to Artifacts only"
        required: false
        default: "false"
        type: boolean

env:
  RELEASE_BRANCH: ${{ inputs.release_branch }}
  CLEAN: ${{ inputs.clean }}
  TZ: Europe/Moscow

jobs:
  Generate:
    runs-on: ubuntu-latest
    name: "${{ inputs.target }} ; ${{ inputs.release_branch }}"

    steps:
      - name: Initialization System Environment
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip tar gzip jq curl
          sudo timedatectl set-timezone "$TZ"
          echo "TARGET=${{ inputs.target }}" >> $GITHUB_ENV

      - name: Setup Environment Variables
        run: |
          if [ "$TARGET" == "Raspberry Pi 3B" ]; then
            echo "PROFILE=rpi-3" >> $GITHUB_ENV
            echo "TARGET_SYSTEM=bcm27xx/bcm2710" >> $GITHUB_ENV
            echo "TARGET_NAME=bcm27xx-bcm2710" >> $GITHUB_ENV
            echo "ARCH_2=aarch64" >> $GITHUB_ENV
          elif [ "$TARGET" == "Raspberry Pi 4B" ]; then
            echo "PROFILE=rpi-4" >> $GITHUB_ENV
            echo "TARGET_SYSTEM=bcm27xx/bcm2711" >> $GITHUB_ENV
            echo "TARGET_NAME=bcm27xx-bcm2711" >> $GITHUB_ENV
            echo "ARCH_2=aarch64" >> $GITHUB_ENV
          elif [ "$TARGET" == "x86-64" ]; then
            echo "PROFILE=generic" >> $GITHUB_ENV
            echo "TARGET_SYSTEM=x86/64" >> $GITHUB_ENV
            echo "TARGET_NAME=x86-64" >> $GITHUB_ENV
            echo "ARCH_2=x86_64" >> $GITHUB_ENV
          fi
          echo "WORKING_DIR=${RELEASE_BRANCH%:*}-imagebuilder-$TARGET_NAME.Linux-x86_64" >> $GITHUB_ENV
          echo "DOWNLOAD_BASE=https://downloads.${RELEASE_BRANCH%:*}.org" >> $GITHUB_ENV
          echo "BASE=${RELEASE_BRANCH%:*}" >> $GITHUB_ENV
          echo "BRANCH=${RELEASE_BRANCH#*:}" >> $GITHUB_ENV
          echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: origin

      - name: Download Image Builder
        run: |
          if [ "$BRANCH" == "snapshots" ]; then
            URL="$DOWNLOAD_BASE/snapshots/targets/$TARGET_SYSTEM/openwrt-imagebuilder-$TARGET_NAME.Linux-x86_64.tar.zst"
          else
            URL="$DOWNLOAD_BASE/releases/$BRANCH/targets/$TARGET_SYSTEM/openwrt-imagebuilder-$BRANCH-$TARGET_NAME.Linux-x86_64.tar.zst"
          fi
          echo "Downloading: $URL"
          wget -nv "$URL" -O imagebuilder.tar.zst
          tar --zstd -xf imagebuilder.tar.zst
          rm -f imagebuilder.tar.zst
          mv openwrt-imagebuilder-* $WORKING_DIR
          cp -r $GITHUB_WORKSPACE/origin/* $GITHUB_WORKSPACE/$WORKING_DIR/
          sync

      - name: Download external packages (sing-box-extended + Tachyon)
        run: |
          cd $WORKING_DIR
          mkdir -p packages
          bash scripts/sing-box-extended.sh
          bash scripts/tachyon.sh
          echo "=== packages/ ==="
          ls -lh packages/

      - name: Compile Firmware
        run: |
          cd $WORKING_DIR
          if [ "$CLEAN" == "true" ]; then
            make clean || true
          fi
          bash make-build.sh $PROFILE
          mkdir -p compiled_images
          for file in bin/targets/"$TARGET_SYSTEM"/*.img.gz; do
            [ -f "$file" ] && mv "$file" compiled_images/ || true
          done
          ls -lh compiled_images/ || true

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: friWrt-${{ env.TARGET_NAME }}-${{ env.BRANCH }}-${{ env.DATE }}
          path: ${{ env.WORKING_DIR }}/compiled_images/*
          if-no-files-found: warn
