name: Generate friWrt Firmware

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Select the release branch:"
        required: true
        default: "openwrt:25.12.5"
        type: choice
        options:
          - openwrt:25.12.5
          - openwrt:25.12.4
          - openwrt:25.12.3
          - openwrt:24.10.8
      clean:
        description: "Do 'make clean'"
        required: false
        default: "true"
        type: boolean

env:
  RELEASE_BRANCH: ${{ inputs.release_branch }}
  CLEAN: ${{ inputs.clean }}
  TZ: Europe/Moscow
  TARGET: x86-64
  PROFILE: generic
  TARGET_SYSTEM: x86/64
  TARGET_NAME: x86-64
  ARCH_2: x86_64

jobs:
  Generate:
    runs-on: ubuntu-latest
    name: "x86-64 ; ${{ inputs.release_branch }}"

    steps:
      - name: Initialization System Environment
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip tar gzip jq curl zstd
          sudo timedatectl set-timezone "$TZ"

      - name: Setup Environment Variables
        run: |
          echo "WORKING_DIR=${RELEASE_BRANCH%:*}-imagebuilder-$TARGET_NAME.Linux-x86_64" >> $GITHUB_ENV
          echo "DOWNLOAD_BASE=https://downloads.${RELEASE_BRANCH%:*}.org" >> $GITHUB_ENV
          echo "BASE=${RELEASE_BRANCH%:*}" >> $GITHUB_ENV
          echo "BRANCH=${RELEASE_BRANCH#*:}" >> $GITHUB_ENV
          echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: origin

      - name: Download Image Builder
        run: |
          if [ "$BRANCH" == "snapshots" ]; then
            URL="$DOWNLOAD_BASE/snapshots/targets/$TARGET_SYSTEM/openwrt-imagebuilder-$TARGET_NAME.Linux-x86_64.tar.zst"
          else
            URL="$DOWNLOAD_BASE/releases/$BRANCH/targets/$TARGET_SYSTEM/openwrt-imagebuilder-$BRANCH-$TARGET_NAME.Linux-x86_64.tar.zst"
          fi
          echo "Downloading: $URL"
          wget -nv "$URL" -O imagebuilder.tar.zst
          tar --zstd -xf imagebuilder.tar.zst
          rm -f imagebuilder.tar.zst
          mv openwrt-imagebuilder-* $WORKING_DIR
          cp -r $GITHUB_WORKSPACE/origin/* $GITHUB_WORKSPACE/$WORKING_DIR/
          sync

      - name: Download external packages (sing-box-extended + Tachyon + internet-detector)
        run: |
          cd $WORKING_DIR
          mkdir -p packages
          bash scripts/sing-box-extended.sh
          bash scripts/tachyon.sh
          bash scripts/internet-detector.sh
          echo "=== packages/ ==="
          ls -lh packages/

      - name: Compile Firmware
        run: |
          cd $WORKING_DIR
          if [ "$CLEAN" == "true" ]; then
            make clean || true
          fi
          bash make-build.sh $PROFILE
          mkdir -p compiled_images
          for file in bin/targets/"$TARGET_SYSTEM"/*.img.gz; do
            [ -f "$file" ] && mv "$file" compiled_images/ || true
          done
          ls -lh compiled_images/ || true

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: friWrt-x86-64-${{ env.BRANCH }}-${{ env.DATE }}
          path: ${{ env.WORKING_DIR }}/compiled_images/*
          if-no-files-found: warn
